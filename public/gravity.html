<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>중력 공</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  /* 구석의 작은 조작 패널: 평소엔 흐리고, 포인터가 가까이 오면 또렷해진다 */
  #ui { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center;
        padding: 8px 10px; border-radius: 999px; background: rgba(255,255,255,.08); backdrop-filter: blur(6px);
        opacity: .25; transition: opacity .25s; user-select: none; }
  #ui button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,.12);
        color: #fff; font-size: 16px; line-height: 34px; cursor: pointer; }
  #ui button.off { opacity: .4; }
  #ui input { width: 90px; accent-color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="clear" title="전부 지우기">✕</button>
  <button id="trail" title="꼬리 켜기/끄기">〰</button>
  <input id="g" type="range" min="0.2" max="5" step="0.1" value="1.5" title="중력 세기">
  <button id="pause" title="일시정지/재생">❚❚</button>
</div>
<script>
// ───── 조절용 상수 ─────
const SLINGSHOT = true;      // true: 드래그 반대 방향으로 발사(새총), false: 드래그 방향 그대로
const THROW_SPEED = 0.03;    // 드래그 1px 당 속도(px/프레임)
const MASS_MIN = 20, MASS_MAX = 600, MASS_PER_MS = 0.15; // 누르고 있는 시간에 따른 질량
const RADIUS_K = 2;          // 반지름 = √질량 × RADIUS_K
const SOFTENING = 20;        // 너무 가까울 때 힘이 폭주하지 않게
const TRAIL_FADE = 0.08;     // 꼬리가 사라지는 속도 (클수록 빨리 사라짐)
const STAR_COUNT = 120;

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
let W = 0, H = 0, dpr = 1, stars = [];
let balls = [], flashes = [];
let G = 1.5, trails = true, paused = false;
let press = null; // 누르는 중인 정보 { x, y, cx, cy, t0, hue }

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: STAR_COUNT }, () => [Math.random() * W, Math.random() * H, Math.random() * 1.2 + 0.3]);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

// ───── 색 ─────
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const radius = m => Math.sqrt(m) * RADIUS_K;

function addBall(x, y, vx, vy, m, color) {
  balls.push({ x, y, vx, vy, m, r: radius(m), color, px: x, py: y, wrapped: false });
}

// ───── 첫 화면: 가운데 큰 공 + 안정 궤도의 작은 공 셋 ─────
function seed() {
  balls = []; flashes = [];
  const cx = W / 2, cy = H / 2, M = 400;
  addBall(cx, cy, 0, 0, M, hsl2rgb(45, 90, 65));
  [[120, 30, 200], [190, 25, 320], [260, 20, 180]].forEach(([d, m, hue], i) => {
    const a = i * 2.1, v = Math.sqrt(G * M / d); // 원 궤도 속도
    addBall(cx + Math.cos(a) * d, cy + Math.sin(a) * d, -Math.sin(a) * v, Math.cos(a) * v, m, hsl2rgb(hue, 85, 60));
  });
}
seed();

// ───── 입력: 마우스와 터치를 포인터 이벤트 하나로 ─────
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  press = { x: e.clientX, y: e.clientY, cx: e.clientX, cy: e.clientY, t0: performance.now(), hue: Math.random() * 360 };
});
canvas.addEventListener('pointermove', e => { if (press) { press.cx = e.clientX; press.cy = e.clientY; } });
function release(e) {
  if (!press) return;
  const m = Math.min(MASS_MAX, MASS_MIN + (performance.now() - press.t0) * MASS_PER_MS);
  const dx = press.cx - press.x, dy = press.cy - press.y, s = SLINGSHOT ? -THROW_SPEED : THROW_SPEED;
  addBall(press.x, press.y, dx * s, dy * s, m, hsl2rgb(press.hue, 85, 60));
  press = null;
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', () => { press = null; });

// 조작 패널: 포인터가 가까우면 또렷하게
window.addEventListener('pointermove', e => {
  const r = ui.getBoundingClientRect();
  const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
  ui.style.opacity = Math.hypot(dx, dy) < 120 ? 1 : 0.25;
});
document.getElementById('clear').onclick = () => { balls = []; flashes = []; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); };
document.getElementById('trail').onclick = e => { trails = !trails; e.currentTarget.classList.toggle('off', !trails); };
document.getElementById('g').oninput = e => { G = parseFloat(e.target.value); };
document.getElementById('pause').onclick = e => { paused = !paused; e.currentTarget.textContent = paused ? '▶' : '❚❚'; };

// ───── 물리 ─────
function step(dt) {
  const n = balls.length;
  for (let i = 0; i < n; i++) {
    const a = balls[i];
    for (let j = i + 1; j < n; j++) {
      const b = balls[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      // 화면이 이어져 있으므로 더 가까운 쪽(반대편 포함)으로 끌어당긴다
      if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
      if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
      const d2 = dx * dx + dy * dy + SOFTENING * SOFTENING, d = Math.sqrt(d2), f = G / d2;
      const ux = dx / d, uy = dy / d;
      a.vx += ux * f * b.m * dt; a.vy += uy * f * b.m * dt;
      b.vx -= ux * f * a.m * dt; b.vy -= uy * f * a.m * dt;
    }
  }
  for (const b of balls) {
    b.px = b.x; b.py = b.y; b.wrapped = false;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -b.r) { b.x += W + 2 * b.r; b.wrapped = true; } else if (b.x > W + b.r) { b.x -= W + 2 * b.r; b.wrapped = true; }
    if (b.y < -b.r) { b.y += H + 2 * b.r; b.wrapped = true; } else if (b.y > H + b.r) { b.y -= H + 2 * b.r; b.wrapped = true; }
  }
  // 충돌 → 합치기 (질량 합, 운동량 보존, 색은 질량 비율로 섞기)
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      if (Math.hypot(b.x - a.x, b.y - a.y) >= a.r + b.r) continue;
      const m = a.m + b.m, wa = a.m / m, wb = b.m / m;
      flashes.push({ x: a.x * wa + b.x * wb, y: a.y * wa + b.y * wb, r: radius(m), age: 0, color: a.m >= b.m ? a.color : b.color });
      a.x = a.x * wa + b.x * wb; a.y = a.y * wa + b.y * wb;
      a.vx = a.vx * wa + b.vx * wb; a.vy = a.vy * wa + b.vy * wb;
      a.color = a.color.map((c, k) => c * wa + b.color[k] * wb);
      a.m = m; a.r = radius(m); a.wrapped = true;
      balls.splice(j, 1); j--;
    }
  }
}

// ───── 그리기 ─────
function drawBall(x, y, r, color, glow = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,.95)');
  g.addColorStop(0.35, rgba(color, 1));
  g.addColorStop(1, rgba(color, 0));
  ctx.shadowBlur = r * 1.5 * glow; ctx.shadowColor = rgba(color, .8);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}
function draw() {
  if (trails) { ctx.fillStyle = `rgba(0,0,0,${TRAIL_FADE})`; ctx.fillRect(0, 0, W, H); }
  else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (const [x, y, r] of stars) ctx.fillRect(x, y, r, r);
  if (trails) for (const b of balls) {
    if (b.wrapped) continue; // 반대편으로 넘어간 프레임은 선을 끊는다
    ctx.strokeStyle = rgba(b.color, .6); ctx.lineWidth = Math.max(1, b.r * .15);
    ctx.beginPath(); ctx.moveTo(b.px, b.py); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const b of balls) drawBall(b.x, b.y, b.r, b.color);
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i], t = f.age / 22;
    ctx.strokeStyle = rgba(f.color, 1 - t); ctx.lineWidth = 3 * (1 - t);
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r + t * f.r * 2.5, 0, Math.PI * 2); ctx.stroke();
    if (++f.age > 22) flashes.splice(i, 1);
  }
  if (press) { // 던지기 전 미리보기: 커지며 색이 바뀌는 공 + 발사 방향 점선
    press.hue = (press.hue + 4) % 360;
    const m = Math.min(MASS_MAX, MASS_MIN + (performance.now() - press.t0) * MASS_PER_MS), c = hsl2rgb(press.hue, 85, 60);
    drawBall(press.x, press.y, radius(m), c, 1.5);
    const dx = press.cx - press.x, dy = press.cy - press.y, k = SLINGSHOT ? -1 : 1;
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(press.x, press.y); ctx.lineTo(press.x + dx * k, press.y + dy * k); ctx.stroke();
    if (SLINGSHOT) { ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.moveTo(press.x, press.y); ctx.lineTo(press.cx, press.cy); ctx.stroke(); }
    ctx.setLineDash([]);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(2, (now - last) / 16.667); last = now; // 60fps 기준 시간 보정, 탭 전환 뒤 폭주 방지
  if (!paused) step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
